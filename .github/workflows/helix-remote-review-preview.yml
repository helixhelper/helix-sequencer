name: Helix Remote Review Preview MP4

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.xml'
      - '**/*.xsq'
      - '**/*.xmodel'
      - '**/*.lms'
      - 'assets/**'
      - '.github/trigger-mp4-preview.txt'
      - 'requirements*.txt'
  push:
    branches:
      - '**'
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.xml'
      - '**/*.xsq'
      - '**/*.xmodel'
      - '**/*.lms'
      - 'assets/**'
      - '.github/trigger-mp4-preview.txt'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Deterministic benchmark duration in seconds"
        required: false
        default: "30"
      fps:
        description: "Preview frames per second"
        required: false
        default: "10"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PREVIEW_AUDIO_DIR: test_runs/outcome_preview_input
  PREVIEW_LAYOUT_DIR: test_runs/outcome_preview_layout
  PREVIEW_DIR: test_runs/outcome_preview
  XLIGHTS_VERSION: "2026.17"
  XLIGHTS_APPIMAGE: /tmp/xLights-2026.17-x86_64.AppImage
  XLIGHTS_APPIMAGE_SHA256: 90a981be5409dd0e895d08de91edd6060e113f80cec7be5ffc67e545c97a58f6

jobs:
  render-winner-preview:
    name: Render downloadable winner MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install preview dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn

      - name: Install xLights headless runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 xvfb xauth

      - name: Compile preview stack
        run: python -m compileall -q core ai xlights tools main.py gui_launcher.py

      - name: Generate source-clean benchmark audio
        env:
          PREVIEW_DURATION: ${{ inputs.duration_seconds || '30' }}
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_AUDIO_DIR" "$PREVIEW_LAYOUT_DIR" "$PREVIEW_DIR"
          python tools/generate_structured_benchmark_audio.py \
            "$PREVIEW_AUDIO_DIR/helix-outcome-preview.wav" \
            --duration "$PREVIEW_DURATION"

      - name: Build Drummer V3 review layout
        run: |
          set -euo pipefail
          python tools/build_helixville4_finished_drummer_layout.py \
            --output-dir "$PREVIEW_LAYOUT_DIR"
          test -s "$PREVIEW_LAYOUT_DIR/xlights_rgbeffects.xml"

      - name: Build and render the active Helix outcome
        env:
          PREVIEW_FPS: ${{ inputs.fps || '10' }}
        run: |
          set -euo pipefail
          python -m tools.helixia_smoke_preview \
            --profile master \
            --audio "$PREVIEW_AUDIO_DIR/helix-outcome-preview.wav" \
            --layout "$PREVIEW_LAYOUT_DIR/xlights_rgbeffects.xml" \
            --template template.xsq \
            --output-dir "$PREVIEW_DIR" \
            --fps "$PREVIEW_FPS" \
            --width 960 \
            --height 540 \
            --contact-sheet-samples 8 \
            --contact-sheet-mode both

      - name: Cache pinned xLights AppImage
        uses: actions/cache@v4
        with:
          path: ${{ env.XLIGHTS_APPIMAGE }}
          key: xlights-appimage-${{ env.XLIGHTS_VERSION }}-${{ env.XLIGHTS_APPIMAGE_SHA256 }}

      - name: Download pinned xLights headless renderer
        run: |
          set -euo pipefail
          if [ ! -s "$XLIGHTS_APPIMAGE" ]; then
            curl --fail --location --retry 3 --retry-delay 2 \
              "https://github.com/xLightsSequencer/xLights/releases/download/${XLIGHTS_VERSION}/xLights-${XLIGHTS_VERSION}-x86_64.AppImage" \
              --output "$XLIGHTS_APPIMAGE"
          fi
          echo "$XLIGHTS_APPIMAGE_SHA256  $XLIGHTS_APPIMAGE" | sha256sum -c -
          chmod +x "$XLIGHTS_APPIMAGE"

      - name: Native xLights headless acceptance render
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          XL_HEADLESS_NO_GL: "1"
        run: |
          set -euo pipefail
          XSQ="$(find "$PREVIEW_DIR" -maxdepth 1 -type f -name 'helix-outcome-preview,*.xsq' | head -n 1)"
          test -n "$XSQ"
          mkdir -p "$PREVIEW_DIR/native-xlights"
          xvfb-run -a "$XLIGHTS_APPIMAGE" --headless \
            -s "$PREVIEW_DIR" \
            --outputdir "$PREVIEW_DIR/native-xlights" \
            "$XSQ"
          find "$PREVIEW_DIR/native-xlights" -maxdepth 1 -type f -name '*.fseq' -size +0c -print -quit | grep -q .

      - name: Validate observable render health
        run: |
          set -euo pipefail
          SHOW="$(find "$PREVIEW_DIR" -maxdepth 1 -type f -name 'helix-outcome-preview,*.show.json' | head -n 1)"
          DENSITY="$(find "$PREVIEW_DIR" -maxdepth 1 -type f -name 'helix-outcome-preview,*.visual-density.json' | head -n 1)"
          test -n "$SHOW"
          test -n "$DENSITY"
          python -m tools.render_health \
            --show-manifest "$SHOW" \
            --visual-density "$DENSITY" \
            --require-drummer \
            --require-native-choreography \
            --json-out "$PREVIEW_DIR/render-health.json"

      - name: Validate preview and build manifest
        env:
          PREVIEW_DURATION: ${{ inputs.duration_seconds || '30' }}
        run: |
          set -euo pipefail
          python -m tools.build_outcome_preview_manifest \
            --output-dir "$PREVIEW_DIR" \
            --benchmark-duration "$PREVIEW_DURATION" \
            --require-drummer \
            --require-drum-classes \
            --require-native-choreography \
            --summary-out review_summary.md

      - name: Upload MP4 preview and sequence artifacts
        id: upload-preview
        uses: actions/upload-artifact@v4
        with:
          name: helix-remote-review-preview-mp4
          path: |
            review_summary.md
            test_runs/outcome_preview/**/*.mp4
            test_runs/outcome_preview/**/*.xsq
            test_runs/outcome_preview/**/*.fseq
            test_runs/outcome_preview/**/*.json
            test_runs/outcome_preview/**/*.txt
            test_runs/outcome_preview/**/*.jpg
            test_runs/outcome_preview/xlights_rgbeffects.xml
            test_runs/outcome_preview/xlights_networks.xml
            test_runs/outcome_preview_layout/helixia_manifest.json
            test_runs/outcome_preview_layout/HELIXIA_LAYOUT_NOTES.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Add artifact link to run summary
        env:
          ARTIFACT_URL: ${{ steps.upload-preview.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo "## Download"
            echo
            echo "[Download the preview MP4 bundle]($ARTIFACT_URL)"
            echo
            cat review_summary.md
            echo
            echo "## Observable render health"
            echo
            cat "$PREVIEW_DIR/render-health.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach preview link to pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload-preview.outputs.artifact-url }}
          PREVIEW_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- helix-outcome-preview -->';
            const body = [
              marker,
              '### Helix outcome preview',
              '',
              `[Download the MP4 preview bundle](${process.env.ARTIFACT_URL})`,
              '',
              `Rendered the active \`master\` profile from \`${process.env.PREVIEW_SHA.slice(0, 12)}\` using the deterministic benchmark and the finished Drummer V3 layout.`,
              `Native xLights ${process.env.XLIGHTS_VERSION || 'pinned'} headless rendering accepted the generated show folder.`,
              'The preview gate requires native engine choreography, observable render health, and final kick, snare, hihat, tom, and cymbal placements.',
              'The Actions artifact is retained for 14 days.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
