name: Helix Remote Review Preview MP4

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.xml'
      - '**/*.xsq'
      - '**/*.xmodel'
      - '**/*.lms'
      - 'assets/**'
      - '.github/trigger-mp4-preview.txt'
      - 'requirements*.txt'
  push:
    branches:
      - '**'
    paths:
      - '**/*.py'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.xml'
      - '**/*.xsq'
      - '**/*.xmodel'
      - '**/*.lms'
      - 'assets/**'
      - '.github/trigger-mp4-preview.txt'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Deterministic benchmark duration in seconds"
        required: false
        default: "30"
      fps:
        description: "Preview frames per second"
        required: false
        default: "10"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONPATH: .
  PREVIEW_AUDIO_DIR: test_runs/outcome_preview_input
  PREVIEW_LAYOUT_DIR: test_runs/outcome_preview_layout
  PREVIEW_DIR: test_runs/outcome_preview

jobs:
  render-winner-preview:
    name: Render downloadable winner MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install preview dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow scikit-learn

      - name: Compile preview stack
        run: python -m compileall -q core ai xlights tools main.py gui_launcher.py

      - name: Generate source-clean benchmark audio
        env:
          PREVIEW_DURATION: ${{ inputs.duration_seconds || '30' }}
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_AUDIO_DIR" "$PREVIEW_LAYOUT_DIR" "$PREVIEW_DIR"
          python tools/generate_structured_benchmark_audio.py \
            "$PREVIEW_AUDIO_DIR/helix-outcome-preview.wav" \
            --duration "$PREVIEW_DURATION"

      - name: Build Drummer V3 review layout
        run: |
          set -euo pipefail
          python tools/build_helixville4_finished_drummer_layout.py \
            --output-dir "$PREVIEW_LAYOUT_DIR"
          test -s "$PREVIEW_LAYOUT_DIR/xlights_rgbeffects.xml"

      - name: Build and render the active Helix outcome
        env:
          PREVIEW_FPS: ${{ inputs.fps || '10' }}
        run: |
          set -euo pipefail
          python -m tools.helixia_smoke_preview \
            --profile master \
            --audio "$PREVIEW_AUDIO_DIR/helix-outcome-preview.wav" \
            --layout "$PREVIEW_LAYOUT_DIR/xlights_rgbeffects.xml" \
            --template template.xsq \
            --output-dir "$PREVIEW_DIR" \
            --fps "$PREVIEW_FPS" \
            --width 960 \
            --height 540 \
            --contact-sheet-samples 8 \
            --contact-sheet-mode both

      - name: Validate preview and build manifest
        env:
          PREVIEW_DURATION: ${{ inputs.duration_seconds || '30' }}
        run: |
          set -euo pipefail
          python -m tools.build_outcome_preview_manifest \
            --output-dir "$PREVIEW_DIR" \
            --benchmark-duration "$PREVIEW_DURATION" \
            --require-drummer \
            --summary-out review_summary.md

      - name: Upload MP4 preview and sequence artifacts
        id: upload-preview
        uses: actions/upload-artifact@v4
        with:
          name: helix-remote-review-preview-mp4
          path: |
            review_summary.md
            test_runs/outcome_preview/**/*.mp4
            test_runs/outcome_preview/**/*.xsq
            test_runs/outcome_preview/**/*.json
            test_runs/outcome_preview/**/*.txt
            test_runs/outcome_preview/**/*.jpg
            test_runs/outcome_preview/xlights_rgbeffects.xml
            test_runs/outcome_preview/xlights_networks.xml
            test_runs/outcome_preview_layout/helixia_manifest.json
            test_runs/outcome_preview_layout/HELIXIA_LAYOUT_NOTES.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Add artifact link to run summary
        env:
          ARTIFACT_URL: ${{ steps.upload-preview.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo "## Download"
            echo
            echo "[Download the preview MP4 bundle]($ARTIFACT_URL)"
            echo
            cat review_summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach preview link to pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload-preview.outputs.artifact-url }}
          PREVIEW_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- helix-outcome-preview -->';
            const body = [
              marker,
              '### Helix outcome preview',
              '',
              `[Download the MP4 preview bundle](${process.env.ARTIFACT_URL})`,
              '',
              `Rendered the active \`master\` profile from \`${process.env.PREVIEW_SHA.slice(0, 12)}\` using the deterministic benchmark and the finished Drummer V3 layout.`,
              'The preview gate now requires nonzero analyzed cues, placement requests, AUTO Drummer timing events, and final drummer model effects.',
              'The Actions artifact is retained for 14 days.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
