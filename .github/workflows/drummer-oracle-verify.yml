name: Drummer Oracle Verification

on:
  push:
    branches:
      - codex/drummer-oracle-verify

permissions:
  contents: read

jobs:
  verify-drummer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy librosa soundfile numba llvmlite imageio imageio-ffmpeg pillow pytest

      - name: Build minimal drummer XSQ
        run: |
          mkdir -p test_runs/drummer_oracle
          cat > test_runs/drummer_oracle/base.xsq <<'EOF'
          <xsequence>
            <ElementEffects/>
          </xsequence>
          EOF

      - name: Inject accepted drummer behavior
        env:
          PYTHONPATH: .
        run: |
          python tools/integrate_drummer_v3_into_xsq.py             test_runs/drummer_oracle/base.xsq             'Helix Audiolights.mp3'             --output test_runs/drummer_oracle/DrummerOracle_FIXED.xsq             --report test_runs/drummer_oracle/drummer_run_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('test_runs/drummer_oracle/drummer_run_report.json').read_text())
          expected = {
              'kick_events': 193,
              'snare_events': 37,
              'tom_events': 9,
              'hihat_events': 205,
              'cymbal_events': 824,
              'drum_bus_events': 47,
          }
          assert report['behavior_profile'] == 'placeholder_v1_b27e8d7', report
          assert report['behavior_audio_source'] == 'original_mix', report
          assert report['behavior_event_count'] == 1315, report
          assert report['detector_counts'] == expected, report
          assert report['downbeat_impact_count'] == 47, report
          assert report['target_count'] == 8, report
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Run drummer regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q             tests/test_drummer_behavior_oracle.py             tests/test_render_drummer_ground_truth.py             tests/test_drummer_v3_xsq_integration.py             tests/test_drummer_v3_pose_sheet.py

      - name: Render corrected full-song drummer MP4
        env:
          PYTHONPATH: .
        run: |
          python tools/render_drummer_v3_preview.py             test_runs/drummer_oracle/DrummerOracle_FIXED.xsq             --audio 'Helix Audiolights.mp3'             --output test_runs/drummer_oracle/Helix_Drummer_ORACLE_FIXED.mp4             --fps 30

      - name: Verify output
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import imageio_ffmpeg

          path = Path('test_runs/drummer_oracle/Helix_Drummer_ORACLE_FIXED.mp4')
          assert path.exists() and path.stat().st_size > 10000
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          proc = subprocess.run([ff, '-i', str(path)], capture_output=True, text=True)
          duration_line = next(line for line in proc.stderr.splitlines() if 'Duration:' in line)
          print(duration_line.strip())
          PY

      - name: Upload corrected drummer
        uses: actions/upload-artifact@v4
        with:
          name: drummer-oracle-fixed
          path: test_runs/drummer_oracle/**/*
          if-no-files-found: error
